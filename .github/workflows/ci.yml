name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install
        run: npm ci || npm install
      - name: Typecheck
        run: npm run type-check
      # Node 24 原生类型剥离，无需额外测试运行时
      - name: Test
        run: npm test
