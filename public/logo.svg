<svg xmlns="http://www.w3.org/2000/svg" width="1408" height="768" viewBox="0 0 1408 768" role="img" aria-labelledby="logo-title logo-description">
  <title id="logo-title">SEKAI Pass</title>
  <desc id="logo-description">The original SEKAI Pass wordmark: a glowing open card, three purple shards, white SEKAI lettering, and a lavender Pass subtitle.</desc>
  <defs>
    <linearGradient id="shard-center-fill" x1="490" y1="260" x2="632" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8c3d9e" />
      <stop offset="1" stop-color="#a67fc5" />
    </linearGradient>
    <linearGradient id="shard-bottom-fill" x1="516" y1="352" x2="617" y2="352" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9250a7" />
      <stop offset="1" stop-color="#beadd9" />
    </linearGradient>
    <filter id="card-glow" x="-20%" y="-30%" width="140%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="15" result="blur" />
      <feFlood flood-color="#a5a9e0" result="light" />
      <feComposite in="light" in2="blur" operator="in" result="glow" />
      <feMerge><feMergeNode in="glow" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <filter id="shard-glow" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="15" result="blur" />
      <feFlood flood-color="#b54bd1" result="light" />
      <feComposite in="light" in2="blur" operator="in" result="glow" />
      <feMerge><feMergeNode in="glow" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>

